    <script type="module">// 純資料與劇情狀態機；不依賴畫面，可直接用 node --test 驗證。
const uid = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
function createPhotoDetails(config, random=Math.random) {
  const days=[1,2,3,4,5,6,7];
  for(let i=days.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[days[i],days[j]]=[days[j],days[i]];}
  return Object.fromEntries(config.members.map((m,i)=>[m.id,{daysAgo:days[i],description:config.photoDescriptions?.[m.id]||""}]));
}
function photoLibrary(state, config) {
  return config.members.map(m=>({id:m.id,member:m.id,side:"me",src:config.assets.pairedPhoto(m.id,"me"),...state.photoDetails[m.id]})).sort((a,b)=>a.daysAgo-b.daysAgo);
}
function personalize(state,text) {
  return String(text??"").replaceAll("{{nickname}}",state.profile.nickname||state.profile.name).replaceAll("{{name}}",state.profile.name);
}
function completeOnboarding(state, username, nickname, now=Date.now()) {
  const handle=String(username).trim().replace(/^@/,""),name=String(nickname).trim();
  if(!/^[A-Za-z0-9_.]{1,30}$/.test(handle))throw new Error("Instagram ID 請使用 1–30 個英文字母、數字、底線或句點。");
  if(!name||name.length>40)throw new Error("稱呼請填寫 1–40 個字。");
  state.profile.username=handle;state.profile.nickname=name;state.profile.name=name;
  if(!state.onboardingComplete){const paused=Math.max(0,now-(state.setupStartedAt??now));state.jobs.forEach(j=>j.dueAt+=paused);}
  state.onboardingComplete=true;state.setupStartedAt=null;
}
function upgradeState(state, config) {
  if(typeof state.profile.nickname!=="string")state.profile.nickname=state.profile.name;
  if(typeof state.onboardingComplete!=="boolean"){state.onboardingComplete=false;state.setupStartedAt=Date.now();}
  if(!state.photoDetails)state.photoDetails=createPhotoDetails(config);
  if(state.profile.bio==="서울의 작은 일상 ☁️\n和喜歡的人，收集一些日常。")state.profile.bio="";
  for(const story of state.stories)if(story.demo&&story.author!=="me")story.src=config.assets.pairedPhoto(story.author,"her");
  return state;
}
function createState(config, now = Date.now()) {
  const chats = { kakao: {}, instagram: {} };
  for (const channel of Object.keys(chats)) for (const member of config.members) {
    chats[channel][member.id] = (config.initialMessages[channel]?.[member.id] || []).map((text, i) => ({ id:uid(),sender:member.id,text,time:now - (5-i)*60000,read:false,kind:"text" }));
  }
  return {
    version:1, profile:{...config.player,nickname:config.player.nickname||""}, onboardingComplete:false,setupStartedAt:now,photoDetails:createPhotoDetails(config),chats,posts:[],
    stories:config.seedStories ? config.members.map((m,i)=>({id:uid(),author:m.id,src:config.assets.pairedPhoto(m.id,"her"),createdAt:now-i*180000,seen:false,demo:true})) : [],
    events:{}, jobs:(config.incomingMessages || []).map(x=>({...x,type:"incoming",dueAt:now+x.delay})), usedRules:[], bookmarked:[]
  };
}
function addMessage(state, channel, member, text, sender=member, now=Date.now(), extra={}) {
  if (!state.chats[channel]?.[member]) throw new Error("無效的聊天室");
  const message = {id:uid(),sender,text,time:now,read:sender==="me",kind:"text",...extra};
  state.chats[channel][member].push(message);
  return message;
}
function queueKeywordReplies(state, config, channel, member, text, now=Date.now()) {
  for (const rule of config.keywordRules[channel] || []) {
    if (rule.member!==member || !(rule.keywords || []).some(k=>text.toLocaleLowerCase().includes(k.toLocaleLowerCase()))) continue;
    const key = `${channel}:${rule.id}`;
    if (rule.once && state.usedRules.includes(key)) continue;
    state.usedRules.push(key);
    (rule.replies || []).forEach((reply,i)=>state.jobs.push({id:uid(),type:"incoming",channel,member,text:reply,dueAt:now+(rule.delay??1200)*(i+1)}));
  }
}
function publish(state, config, {type="post", images, caption=""}, now=Date.now()) {
  if (!images?.length) throw new Error("請先選擇照片");
  const item = type==="story"
    ? {id:uid(),author:"me",src:images[0].src,createdAt:now,seen:false}
    : {id:uid(),author:"me",images:images.map(x=>({...x})),caption,time:now,likes:0,liked:false,comments:[],slide:0};
  if (type==="story") state.stories.push(item); else state.posts.unshift(item);
  const selected = type==="story" ? images.slice(0,1) : images;
  for (const image of selected) {
    const member = config.members.find(m=>m.id===image.member);
    if (image.side!=="me" || !member || state.events[member.id]) continue;
    state.events[member.id]={phase:"queued",userShareId:item.id,userShareType:type};
    state.jobs.push({id:uid(),type:"photo-dm",member:member.id,dueAt:now+config.photoEvents.dmDelay});
  }
  return item;
}
function runDueJobs(state, config, now=Date.now()) {
  const notices = [];
  const due=state.jobs.filter(j=>j.dueAt<=now).sort((a,b)=>a.dueAt-b.dueAt);
  for (const job of due) {
    state.jobs=state.jobs.filter(j=>j.id!==job.id);
    const m=config.members.find(x=>x.id===job.member);
    if (!m) continue;
    const script=config.photoEvents.scripts[m.id];
    if (job.type==="incoming") {
      if (!state.chats[job.channel]?.[job.member] || !job.text) continue;
      addMessage(state,job.channel,m.id,job.text,m.id,now);
      notices.push({channel:job.channel,member:m.id,text:job.text});
    } else if (job.type==="photo-dm" && state.events[m.id]?.phase==="queued") {
      addMessage(state,"instagram",m.id,script.question,m.id,now);
      state.events[m.id].phase="asked";
      state.jobs.push({id:uid(),type:"photo-post",member:m.id,dueAt:now+config.photoEvents.postDelay});
      notices.push({channel:"instagram",member:m.id,text:script.question});
    } else if (job.type==="photo-post" && state.events[m.id]?.phase==="asked") {
      const post={id:uid(),author:m.id,images:[{src:config.assets.pairedPhoto(m.id,"her"),member:m.id,side:"her"}],caption:script.caption,time:now,likes:0,liked:false,comments:[],slide:0};
      state.posts.unshift(post);
      state.events[m.id].phase="posted";
      state.events[m.id].counterpartId=post.id;
      state.jobs.push({id:uid(),type:"photo-observer",member:m.id,dueAt:now+config.photoEvents.observerDelay});
      notices.push({postId:post.id,member:m.id,text:`${m.name} 發佈了一則新貼文`});
    } else if (job.type==="photo-observer" && state.events[m.id]?.phase==="posted") {
      const event=state.events[m.id];
      const userExists=event.userShareType==="story" ? state.stories.some(s=>s.id===event.userShareId) : state.posts.some(p=>p.id===event.userShareId);
      if (userExists && state.posts.some(p=>p.id===event.counterpartId)) {
        addMessage(state,"instagram",m.observer,script.observer,m.observer,now);
        notices.push({channel:"instagram",member:m.observer,text:script.observer});
      }
      event.phase="done";
    }
  }
  return notices;
}
function unreadCount(state, channel, member) {
  const lists=member ? [state.chats[channel][member]] : Object.values(state.chats[channel]);
  return lists.reduce((sum,messages)=>sum+messages.filter(m=>!m.read && m.sender!=="me").length,0);
}
function validateSave(value, config) {
  const members=config.members.map(m=>m.id),authors=["me",...members];
  if (!value || value.version!==1 || !value.profile || typeof value.profile.name!=="string" || typeof value.profile.username!=="string" || typeof value.profile.bio!=="string" || typeof value.profile.avatar!=="string" || !Array.isArray(value.posts) || !Array.isArray(value.stories) || !Array.isArray(value.jobs) || !Array.isArray(value.usedRules) || !Array.isArray(value.bookmarked) || !value.events || Array.isArray(value.events) || !value.chats) throw new Error("這不是有效的 itzy phone 存檔");
  for (const channel of ["kakao","instagram"]) for (const m of config.members) {
    if (!Array.isArray(value.chats[channel]?.[m.id]) || value.chats[channel][m.id].some(x=>!x || typeof x.text!=="string" || !Number.isFinite(x.time) || !["me",m.id].includes(x.sender) || !["text","post"].includes(x.kind) || (x.kind==="post"&&typeof x.postId!=="string"))) throw new Error("存檔的聊天資料不完整");
  }
  if(value.posts.some(p=>!p || typeof p.id!=="string" || !authors.includes(p.author) || !Number.isFinite(p.time) || !Number.isFinite(p.likes) || !Array.isArray(p.images) || !p.images.length || p.images.length>10 || !Array.isArray(p.comments) || typeof p.caption!=="string" || p.images.some(i=>!i || typeof i.src!=="string") || p.comments.some(c=>!c || !authors.includes(c.author) || typeof c.text!=="string" || !Number.isFinite(c.time)))) throw new Error("存檔的貼文資料不完整");
  if(value.stories.some(s=>!s || typeof s.id!=="string" || !authors.includes(s.author) || typeof s.src!=="string" || !Number.isFinite(s.createdAt))) throw new Error("存檔的限時動態資料不完整");
  if(value.jobs.some(j=>!j || typeof j.id!=="string" || !members.includes(j.member) || !Number.isFinite(j.dueAt) || !["incoming","photo-dm","photo-post","photo-observer"].includes(j.type) || (j.type==="incoming"&&(!["kakao","instagram"].includes(j.channel)||typeof j.text!=="string")))) throw new Error("存檔的排程資料不完整");
  if(Object.entries(value.events).some(([id,e])=>!members.includes(id) || !e || !["queued","asked","posted","done"].includes(e.phase) || typeof e.userShareId!=="string" || !["post","story"].includes(e.userShareType))) throw new Error("存檔的照片事件不完整");
  if(value.photoDetails&&members.some(id=>!value.photoDetails[id]||!Number.isInteger(value.photoDetails[id].daysAgo)||value.photoDetails[id].daysAgo<1||value.photoDetails[id].daysAgo>7||typeof value.photoDetails[id].description!=="string"))throw new Error("存檔的照片資訊不完整");
  return upgradeState(value,config);
}

const KEY="itzy-phone-save-v1";
let database;
let queue=Promise.resolve();
async function openStorage() {
  try {
    database=await new Promise((resolve,reject)=>{
      const request=indexedDB.open("itzy-phone",1);
      request.onupgradeneeded=()=>request.result.createObjectStore("saves");
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
    });
    return await new Promise((resolve,reject)=>{
      const request=database.transaction("saves").objectStore("saves").get(KEY);
      request.onsuccess=()=>resolve(request.result ?? null); request.onerror=()=>reject(request.error);
    });
  } catch { database=null; try {return JSON.parse(localStorage.getItem(KEY));} catch{return null;} }
}
function saveState(state) {
  const snapshot=structuredClone(state);
  const action=queue.catch(()=>{}).then(()=>{
    if (!database) {localStorage.setItem(KEY,JSON.stringify(snapshot));return;}
    return new Promise((resolve,reject)=>{
      const transaction=database.transaction("saves","readwrite");
      transaction.objectStore("saves").put(snapshot,KEY);
      transaction.oncomplete=resolve; transaction.onerror=()=>reject(transaction.error); transaction.onabort=()=>reject(transaction.error);
    });
  });
  queue=action; return action;
}

document.addEventListener('error',event=>{
  const img=event.target;
  if (!(img instanceof HTMLImageElement)) return;
  let candidates=[];try{candidates=JSON.parse(img.dataset.alternates||'[]');}catch{}
  const next=candidates.shift();
  if (next) {img.dataset.alternates=JSON.stringify(candidates);img.src=next;return;}
  if (img.dataset.fallback) {const fallback=img.dataset.fallback;delete img.dataset.fallback;img.src=fallback;img.dataset.placeholder='true';}
},true);

function snapshotFocus(container) {
  const active=document.activeElement;
  return active && container.contains(active) && active.id ? {id:active.id,start:active.selectionStart,end:active.selectionEnd} : null;
}
function restoreFocus(focus) {
  if (!focus) return;
  const el=document.getElementById(focus.id);if (!el)return;
  el.focus({preventScroll:true});try{el.setSelectionRange(focus.start,focus.end);}catch{}
}
function captureDraft() {

}

}

function sheet(title,body,footer='',className='') {return `<section class="sheet ${className}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><span class="sheet-handle"></span><header class="sheet-header"><button data-action="close-modal" aria-label="關閉">${icon('close')}</button><h2>${esc(title)}</h2><span style="width:20px"></span></header><div class="sheet-scroll">${body}</div>${footer}</section>`;}
function openModal(value) {
  captureDraft();clearTimeout(storyTimer);
  modal=value;renderModal();

}
function closeModal(render=true) {captureDraft();clearTimeout(storyTimer);modal=null;overlay.innerHTML='';screen.classList.remove('has-story');if(render)refresh();}

  } else if(type==='comments') {

  } else if(type==='share-post') {
    const post=state.posts.find(p=>p.id===modal.postId);
    overlay.innerHTML=sheet('傳送貼文',`${C.members.map(m=>`<button class="share-recipient" data-action="send-post" data-member="${m.id}" data-id="${post.id}">${avatar(m.id)}<div><strong>${m.name}</strong><small>${esc(m.username)}</small></div><span class="share-send">傳送</span></button>`).join('')}`);
  } else if(type==='story') renderStoryModal();
  else if(type==='settings')renderSettings();
  else if(type==='weather') {
    const w=C.weather;
    overlay.innerHTML=sheet('首爾天氣',`<div class="weather-detail"><h3>首爾 서울</h3>${icon('cloud')}<div class="weather-temp">${w.temperature}°</div><p>${w.condition} · 最高 ${w.high}° 最低 ${w.low}°<br>${w.note}</p></div><p class="settings-note">固定天氣快照：${w.checkedAt}<br>此為製作當天保存的預報，不會自動更新。</p><a class="link-source" href="${esc(w.source)}" target="_blank" rel="noreferrer">查看天氣資料來源 ↗</a>`);
  } else if(type==='search') {
    overlay.innerHTML=sheet(modal.channel==='kakao'?'搜尋好友':'搜尋訊息',`<div class="search-box" style="margin:0 0 8px">${icon('search')}<input id="chat-search" placeholder="輸入好友名稱或帳號" aria-label="搜尋好友"></div><div id="chat-search-results">${C.members.map(m=>`<div data-search-name="${esc(`${m.name} ${m.username} ${m.korean}`.toLowerCase())}">${renderChatRow(modal.channel,m)}</div>`).join('')}</div>`);
  } else if(type==='chat-info') {
    const m=member(modal.member);
    overlay.innerHTML=sheet('聊天資訊',`<div style="text-align:center">${avatar(m.id,'large')}<h3 style="font-size:15px">${m.name} · ${m.korean}</h3><p style="font-size:11px;color:#999">@${esc(m.username)}</p></div>`);
  } else if(type==='call-info'){
    const i=C.members.findIndex(m=>m.id===modal.member),m=member(modal.member);
    overlay.innerHTML=sheet('通話詳細資訊',`<div class="contact-detail" style="padding:12px">${avatar(m.id,'large',true)}<h2>${m.name}</h2><div class="contact-field">${['今天','昨天','星期四','星期三','星期二'][i]}<span>${i%2?'撥出電話':'來電'} · ${['12 分 08 秒','5 分 32 秒','28 分 14 秒','8 分 46 秒','17 分 02 秒'][i]}</span></div><button class="secondary-button" data-action="contact" data-member="${m.id}">查看聯絡人</button></div>`);
  } else if(type==='notice')overlay.innerHTML=sheet(modal.title,`<p class="sheet-description">${esc(modal.text)}</p><button class="primary-button" data-action="close-modal">知道了</button>`);
  else if(type==='reset')overlay.innerHTML=sheet('重新開始？',`<p class="sheet-description">將清除這個瀏覽器的聊天、貼文、限動與照片事件進度，並重新設定你的手機。</p><button class="secondary-button" data-action="close-modal">取消</button><button class="primary-button danger" data-action="confirm-reset">重新開始</button>`);
  else if(type==='post-options')overlay.innerHTML=sheet('貼文選項',`<button class="share-choice" data-action="share-post" data-id="${modal.postId}">${icon('send')}<strong>傳送到聊天室</strong></button>`);
  else if(type==='pick-post')overlay.innerHTML=sheet('選擇要分享的貼文',`${state.posts.map(p=>`<button class="share-choice" data-action="send-post" data-id="${p.id}" data-member="${route.member}"><span style="width:47px;height:47px">${photoImage(p.images[0],'post-image')}</span><div><strong>${esc(username(p.author))}</strong><small>${esc(p.caption).slice(0,50)||'照片貼文'}</small></div>${icon('send')}</button>`).join('')||'<p class="sheet-description">尚無貼文</p>'}`);
  if(type!=='story'){const scroll=overlay.querySelector('.sheet-scroll');if(scroll)scroll.scrollTop=scrollTop;restoreFocus(focus);}
}

function renderSettings() {
  const content=`<form id="profile-form"><label class="field-label" for="player-name">名字</label><input class="text-field" id="player-name" value="${esc(state.profile.name)}" maxlength="40" required><label class="field-label" for="player-username">Instagram ID</label><input class="text-field" id="player-username" value="${esc(state.profile.username)}" maxlength="30" autocapitalize="none" spellcheck="false" required><label class="field-label" for="player-nickname">成員對你的稱呼</label><input class="text-field" id="player-nickname" value="${esc(state.profile.nickname)}" maxlength="40" required><label class="field-label" for="player-bio">個人簡介</label><textarea class="text-field" id="player-bio" rows="3" maxlength="150">${esc(state.profile.bio)}</textarea><button type="button" class="secondary-button" data-action="upload-avatar">更換頭貼</button><button class="primary-button">儲存</button></form><button class="secondary-button" data-action="lock-phone">鎖定螢幕</button><button class="secondary-button" data-action="reset" style="color:#b16c74">重新開始</button>`;
  overlay.innerHTML=sheet('設定',`${saveBroken?'<p class="error-note">原存檔無法讀取。重新開始會清除這個瀏覽器的進度。</p>':''}${content}`);
}
function renderStoryModal() {
  let stories=activeStories(modal.member);
  if(!stories.length){closeModal(false);toast('目前沒有可觀看的限時動態');return;}
  modal.index=Math.max(0,Math.min(modal.index||0,stories.length-1));
  const s=stories[modal.index];s.seen=true;persist();
  overlay.innerHTML=`<section class="story-viewer" role="dialog" aria-modal="true" aria-label="${personName(s.author)} 的限時動態"><div class="story-bars">${stories.map((_,i)=>`<span class="${i<modal.index?'done':i===modal.index?'current':''}"><i></i></span>`).join('')}</div><header class="story-heading">${avatar(s.author,'small')}<div><strong>${esc(username(s.author))}</strong><small>${age(s.createdAt)}</small></div><button data-action="story-pause" aria-label="暫停限時動態">Ⅱ</button><button data-action="close-modal" aria-label="關閉限時動態">${icon('close')}</button></header><div class="story-picture">${image(s.src,`assets/moment-${s.author==='me'?'yeji':s.author}.svg`,'限時動態照片')}<div class="story-tap"><button data-action="story-prev" aria-label="上一則限時動態"></button><button data-action="story-next" aria-label="下一則限時動態"></button></div></div><footer class="story-footer"><span>${s.author==='me'?'你的限時動態':''}</span>${s.author!=='me'?`<button data-action="story-reply" data-member="${s.author}">傳送訊息 ${icon('send')}</button>`:'<button data-action="compose-story">新增 ＋</button>'}</footer></section>`;
  clearTimeout(storyTimer);storyTimer=setTimeout(nextStory,6000);
}
function nextStory(){if(modal?.kind!=='story')return;const stories=activeStories(modal.member);if(modal.index+1<stories.length){modal.index++;renderStoryModal();}else closeModal();}
function toast(text,notice=null) {
  clearTimeout(toastTimer);toastAction=notice;
  $('#toast').innerHTML=notice?`<button class="toast" data-action="toast-open">${avatar(notice.member,'small')}<div><strong>${personName(notice.member)} · ${notice.postId?'Instagram':notice.channel==='kakao'?'KakaoTalk':'Instagram'}</strong><p>${esc(dialogue(text))}</p></div></button>`:`<div class="toast toast-simple">${esc(text)}</div>`;
  toastTimer=setTimeout(()=>{$('#toast').innerHTML='';toastAction=null;},notice?5200:3000);
}
function showCompose(type='post',selected=[]) {openModal({kind:'compose',type,images:selected.map(p=>({...p})),caption:selected.length===1?(state.photoDetails[selected[0].id]?.description||''):''});}
function slidePost(id,dir){const p=state.posts.find(p=>p.id===id);if(!p)return;p.slide=Math.max(0,Math.min((p.slide||0)+dir,p.images.length-1));commit();}
function sendSharedPost(id,recipient) {
  const post=state.posts.find(p=>p.id===id);if(!post)return;
  addMessage(state,'instagram',recipient,'傳送了一則貼文','me',Date.now(),{kind:'post',postId:id});
  commit(false);go({app:'instagram',page:'chat',member:recipient});toast(`已將貼文傳送給 ${personName(recipient)}`);
}
function updateClock(){const now=Date.now();$('#status-time').textContent=shortTime(now);const time=$('#lock-time');if(time)time.textContent=shortTime(now);const date=$('#lock-date');if(date)date.textContent=longDate(now);}

document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button||button.disabled||!state)return;
  if(!state.onboardingComplete)return;
  const action=button.dataset.action,d=button.dataset;
  if(action==='unlock')unlock();
  else if(action==='app'){if(d.app==='settings')openModal({kind:'settings'});else go({app:d.app,tab:d.app==='kakao'?'chats':undefined,page:d.app==='instagram'?'feed':undefined});}
  else if(action==='home')go({app:'home'});
  else if(action==='unavailable')toast(`${d.app==='safari'?'Safari':'相機'}暫未開放`);
  else if(action==='settings')openModal({kind:'settings'});
  else if(action==='lock-phone')go({app:'lock'});
  else if(action==='close-modal')closeModal();
  else if(action==='weather')openModal({kind:'weather'});
  else if(action==='open-chat')go({app:d.channel==='kakao'?'kakao':'instagram',page:'chat',member:d.member});
  else if(action==='kakao-tab')go({app:'kakao',tab:d.tab});
  else if(action==='kakao-back')go({app:'kakao',tab:'chats'});
  else if(action==='dm-back')go({app:'instagram',page:'dm'});
  else if(action==='ig-tab')go({app:'instagram',page:d.tab});
  else if(action==='ig-saved')go({app:'instagram',page:'feed',saved:true});
  else if(action==='compose')showCompose();
  else if(action==='compose-story')showCompose('story');
  else if(action==='select-photo') {
    if(modal?.kind!=='compose')return;captureDraft();
    const index=modal.images.findIndex(x=>x.id===d.member);
    if(index>=0)modal.images.splice(index,1);
    else if(modal.type==='story')modal.images=[{...photos.find(p=>p.id===d.member)}];
    else if(modal.images.length<10)modal.images.push({...photos.find(p=>p.id===d.member)});
    else toast('一則貼文最多 10 張照片');renderModal();
  } else if(action==='remove-photo') {captureDraft();modal.images.splice(Number(d.index),1);renderModal();}
  else if(action==='upload-images') {$('#image-upload').value='';$('#image-upload').multiple=modal?.type!=='story';$('#image-upload').dataset.mode='compose';$('#image-upload').click();}
  else if(action==='upload-avatar') {$('#image-upload').value='';$('#image-upload').multiple=false;$('#image-upload').dataset.mode='avatar';$('#image-upload').click();}
  else if(action==='publish') {
    if(modal?.kind!=='compose'||!modal.images.length||inFlightUpload)return;
    captureDraft();publish(state,C,{type:modal.type,images:modal.images,caption:modal.caption||''});commit(false);const isStory=modal.type==='story';go({app:'instagram',page:'feed'});toast(isStory?'已分享到你的限時動態':'貼文已分享');
  } else if(action==='like') {
    const p=state.posts.find(x=>x.id===d.id);p.liked=!p.liked;p.likes=Math.max(0,p.likes+(p.liked?1:-1));commit();
  } else if(action==='bookmark') {
    const i=state.bookmarked.indexOf(d.id);if(i<0)state.bookmarked.push(d.id);else state.bookmarked.splice(i,1);commit();
  } else if(action==='slide')slidePost(d.id,Number(d.dir));
  else if(action==='comments')openModal({kind:'comments',postId:d.id});
  else if(action==='share-post')openModal({kind:'share-post',postId:d.id});
  else if(action==='send-post')sendSharedPost(d.id,d.member);
  else if(action==='view-post') {previousRoute={...route};go({app:'instagram',page:'post',postId:d.id,from:d.from});}
  else if(action==='post-back')go(previousRoute.app==='instagram'?previousRoute:{app:'instagram',page:'feed'});
  else if(action==='post-options')openModal({kind:'post-options',postId:d.id});
  else if(action==='photo')go({app:'photos',page:'detail',photo:d.member});
  else if(action==='photos-back')go({app:'photos'});
  else if(action==='photo-share')openModal({kind:'photo-share',member:d.member});
  else if(action==='photo-to-compose')showCompose(d.type,[photos.find(p=>p.member===d.member)]);
  else if(action==='photo-next'||action==='photo-prev')navigatePhoto(action==='photo-next'?1:-1);
  else if(action==='story')openModal({kind:'story',member:d.member,index:0});
  else if(action==='story-next')nextStory();
  else if(action==='story-prev'){if(modal.index>0){modal.index--;renderStoryModal();}else closeModal();}
  else if(action==='story-pause') {const el=overlay.querySelector('.story-viewer');if(el.classList.toggle('story-paused')){clearTimeout(storyTimer);button.textContent='▶';button.setAttribute('aria-label','繼續限時動態');}else{renderStoryModal();}}
  else if(action==='story-reply')go({app:'instagram',page:'chat',member:d.member});
  else if(action==='phone-tab')go({app:'phone',tab:d.tab});
  else if(action==='contact')go({app:'phone',page:'contact',member:d.member});
  else if(action==='phone-back')go({app:'phone',tab:'contacts'});
  else if(action==='call-info')openModal({kind:'call-info',member:d.member});
  else if(action==='missed-calls')openModal({kind:'notice',title:'未接來電',text:'目前沒有未接來電。'});
  else if(action==='sms-thread')go({app:'sms',page:'chat',thread:d.id});
  else if(action==='sms-back')go({app:'sms'});
  else if(action==='search')openModal({kind:'search',channel:d.channel});
  else if(action==='chat-info')openModal({kind:'chat-info',member:d.member});
  else if(action==='chat-emoji'){const el=$('#chat-input');el.value+=' 🤍';el.focus();captureDraft();}
  else if(action==='chat-share')openModal({kind:'pick-post'});
  else if(action==='toast-open'){
    if(!toastAction)return;const n=toastAction;$('#toast').innerHTML='';clearTimeout(toastTimer);toastAction=null;
    if(n.postId){previousRoute={app:'instagram',page:'feed'};go({app:'instagram',page:'post',postId:n.postId});}else go({app:n.channel==='kakao'?'kakao':'instagram',page:'chat',member:n.member});
  } else if(action==='reset')openModal({kind:'reset'});
  else if(action==='confirm-reset'){
    closeModal(false);
    for(const key of Object.keys(drafts))delete drafts[key];
    clearTimeout(toastTimer);$('#toast').innerHTML='';toastAction=null;
    state=createState(C);saveBroken=false;previousRoute={app:'home'};route={app:'setup'};commit();
  }
});

document.addEventListener('submit',event=>{
  const id=event.target.id;
  if(!['setup-form','chat-form','comment-form','profile-form'].includes(id))return;
  event.preventDefault();
  if(id==='setup-form') {
    try{completeOnboarding(state,$('#setup-username').value,$('#setup-nickname').value);commit(false);go({app:'lock'});}
    catch(error){$('#setup-error').textContent=error.message;}
    return;
  }
  if(!state.onboardingComplete)return;
  if(id==='chat-form') {
    const input=$('#chat-input'),text=input.value.trim();if(!text)return;
    const channel=route.app==='kakao'?'kakao':'instagram';addMessage(state,channel,route.member,text,'me');queueKeywordReplies(state,C,channel,route.member,text);input.value='';drafts[`${route.app}:${route.member}`]='';commit();
  } else if(id==='comment-form') {
    const text=$('#comment-input').value.trim();if(!text)return;const post=state.posts.find(p=>p.id===modal.postId);post.comments.push({id:uid(),author:'me',text,time:Date.now()});commit();renderModal();$('#comment-input')?.focus();
  } else if(id==='profile-form') {
    const name=$('#player-name').value.trim(),handle=$('#player-username').value.trim();if(!name||!handle)return;
    try{completeOnboarding(state,handle,$('#player-nickname').value);}catch(error){toast(error.message);return;}
    state.profile.name=name;state.profile.bio=$('#player-bio').value;commit();closeModal();toast('已儲存');
  }
});
document.addEventListener('input',event=>{
  const id=event.target.id;
  if(id==='chat-input'||id==='compose-caption')captureDraft();
  if(id==='photo-description'&&route.app==='photos'&&route.photo){state.photoDetails[route.photo].description=event.target.value;persist();}
  if(id==='contact-search'||id==='chat-search') {
    const query=event.target.value.trim().toLowerCase(),container=id==='contact-search'?$('#contact-list'):$('#chat-search-results');
    container?.querySelectorAll('[data-search-name]').forEach(el=>el.hidden=!el.dataset.searchName.includes(query));
  }
});
document.addEventListener('keydown',event=>{
  if(!state)return;
  if(event.key==='Escape'){if(modal)closeModal();else if(route.app!=='home'&&route.app!=='lock')go({app:'home'});}
  if(route.app==='lock'&&!modal&&['Enter','ArrowUp',' '].includes(event.key)&&!['INPUT','TEXTAREA','BUTTON'].includes(event.target.tagName)){event.preventDefault();unlock();}
  if(event.key==='Enter'&&event.target.matches('[role=button][data-action]'))event.target.click();
  if(event.key==='Tab'&&modal){const nodes=[...overlay.querySelectorAll('button:not(:disabled),input,textarea,select,a[href]')].filter(el=>!el.hidden);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
});
root.addEventListener('pointerdown',event=>{if(event.target.closest('input,textarea,button[data-action="slide"]'))return;pointerStart={x:event.clientX,y:event.clientY,post:event.target.closest('[data-swipe-post]')?.dataset.swipePost,locked:route.app==='lock'};});
root.addEventListener('pointerup',event=>{if(!pointerStart)return;const p=pointerStart;pointerStart=null;if(p.locked&&p.y-event.clientY>35){unlock();return;}if(p.post&&Math.abs(p.x-event.clientX)>45&&Math.abs(p.y-event.clientY)<80)slidePost(p.post,event.clientX<p.x?1:-1);});
root.addEventListener('pointercancel',()=>pointerStart=null);
root.addEventListener('dblclick',event=>{const post=event.target.closest('[data-swipe-post]');if(!post)return;const p=state.posts.find(p=>p.id===post.dataset.swipePost);if(!p.liked){p.liked=true;p.likes++;commit();}});
root.addEventListener('click',event=>{if(route.app==='lock'&&!event.target.closest('[data-action]'))unlock();});
overlay.addEventListener('click',event=>{if(event.target===overlay)closeModal();});
function pressHome(){if(!state||!state.onboardingComplete)return;if(modal)closeModal(false);if(route.app==='lock')unlock();else go({app:'home'});}
$('#home-button').addEventListener('click',pressHome);
let homeGesture=null;
$('#home-button').addEventListener('pointerdown',event=>{homeGesture=event.clientY;event.currentTarget?.setPointerCapture?.(event.pointerId);});
$('#home-button').addEventListener('pointerup',event=>{if(homeGesture!==null&&homeGesture-event.clientY>15)pressHome();homeGesture=null;});
$('#home-button').addEventListener('pointercancel',()=>{homeGesture=null;});

async function readImage(file) {
  if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw new Error('請選擇 JPG、PNG、WebP 或 GIF 圖片');
  if(file.size>20*1024*1024)throw new Error('單張圖片請小於 20 MB');
  const url=URL.createObjectURL(file);
  try {
    const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('這張圖片無法讀取'));i.src=url;});
    const ratio=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.85);
  } finally {URL.revokeObjectURL(url);}
}
$('#image-upload').addEventListener('change',async event=>{
  const files=[...event.target.files];if(!files.length)return;
  const mode=event.target.dataset.mode,activeModal=modal;
  if(mode==='compose'&&activeModal?.kind!=='compose')return;
  inFlightUpload=true;if(mode==='compose'){captureDraft();renderModal();}
  try {
    const capacity=mode==='avatar'?1:activeModal.type==='story'?1:10-activeModal.images.length;
    if(capacity<1){toast('一則貼文最多 10 張照片');return;}
    const processed=[];
    for(const file of files.slice(0,capacity))processed.push({id:uid(),src:await readImage(file),filename:file.name});
    if(mode==='avatar'){state.profile.avatar=processed[0].src;commit();toast('已更換你的頭貼');}
    else if(modal===activeModal){if(activeModal.type==='story')activeModal.images=processed.slice(0,1);else activeModal.images.push(...processed);}
    if(files.length>capacity)toast(`已選取前 ${capacity} 張照片`);
  } catch(error){toast(error.message);}
  finally{inFlightUpload=false;if(modal===activeModal)renderModal();}
});
async function boot() {
  $('#signal').innerHTML=icon('signal');$('#wifi').innerHTML=icon('wifi');
  const loaded=await openStorage();
  try{state=loaded?validateSave(loaded,C):createState(C);}
  catch{state=createState(C);saveBroken=true;}
  route={app:state.onboardingComplete?'lock':'setup'};refresh();if(!loaded)persist();
  if(saveBroken)toast('原存檔無法讀取，可在設定中重新開始。');
  clockTimer=setInterval(updateClock,15000);
  setInterval(()=>{
    if(!state||saveBroken||!state.onboardingComplete)return;
    const notices=runDueJobs(state,C);
    if(!notices.length)return;
    for(const n of notices)if(route.page==='chat'&&route.member===n.member&&((route.app==='kakao'&&n.channel==='kakao')||(route.app==='instagram'&&n.channel==='instagram')))markRead(n.channel,n.member);
    commit();
    const n=notices.at(-1);toast(n.text,n);
  },400);
}
boot();
